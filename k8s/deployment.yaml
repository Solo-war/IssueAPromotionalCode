apiVersion: apps/v1
kind: Deployment
metadata:
  name: promo-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promo-bot
  template:
    metadata:
      labels:
        app: promo-bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/your-org/promo-bot:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: promo-bot-secrets
                  key: BOT_TOKEN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: promo-bot-secrets
                  key: DATABASE_URL
            - name: MODE
              value: "webhook"
            - name: WEBAPP_HOST
              value: "0.0.0.0"
            - name: WEBAPP_PORT
              value: "8080"
            - name: WEBHOOK_URL
              value: "https://your.domain.tld/bot"
            - name: WEBHOOK_PATH
              value: "/telegram"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: promo-bot-secrets
                  key: WEBHOOK_SECRET
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: promo-bot
spec:
  selector:
    app: promo-bot
  ports:
    - name: http
      port: 80
      targetPort: 8080
